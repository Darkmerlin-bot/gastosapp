<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#13102a">
<title>Control de Gastos</title>
<style>
  :root{
    --bg-deep:#0d0919;--bg-base:#13102a;--bg-card:rgba(255,255,255,0.03);--bg-card-h:rgba(255,255,255,0.055);
    --brd:rgba(167,139,250,0.08);--v:#8b5cf6;--vd:#6d28d9;--vl:#c4b5fd;--vg:rgba(139,92,246,0.4);
    --tp:#e2e0ff;--ts:#8b82a8;--tm:#6b6490;--td:#5b5280;--tf:#3f3561;
    --gr:#6ee7b7;--grb:rgba(16,185,129,0.08);--or:#fdba74;--orb:rgba(249,115,22,0.08);
    --rd:#fca5a5;--rds:#ef4444;--sab:env(safe-area-inset-bottom,12px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg-deep);color:var(--tp);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(139,92,246,0.2);border-radius:3px}
  input,button,select{font-family:inherit}input::placeholder{color:var(--td)}input:focus{border-color:rgba(139,92,246,0.4)!important;outline:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @keyframes fadeScale{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

  /* LOGIN */
  .login-bg{min-height:100vh;background:linear-gradient(180deg,#13102a 0%,#0d0919 100%);display:flex;align-items:center;justify-content:center;padding:20px}
  .login-box{width:100%;max-width:380px;text-align:center}
  .login-box .logo{font-size:42px;margin-bottom:8px;animation:bounce 2s infinite}
  .login-box h1{font-size:24px;font-weight:800;letter-spacing:-0.02em;margin-bottom:4px}
  .login-box .sub{color:var(--tm);font-size:14px;margin-bottom:28px}
  .login-card{background:var(--bg-card);border:1px solid var(--brd);border-radius:24px;padding:24px;backdrop-filter:blur(10px)}
  .login-card h2{font-size:16px;font-weight:600;margin-bottom:20px;color:var(--ts)}
  .user-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .user-card{display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px 16px;border-radius:20px;border:2px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.02);cursor:pointer;transition:all 0.25s}
  .user-card:hover{background:rgba(139,92,246,0.08);border-color:rgba(139,92,246,0.3);transform:translateY(-2px)}
  .user-card .av{font-size:48px}.user-card .nm{font-size:16px;font-weight:600}
  .pw-screen{min-height:100vh;background:linear-gradient(180deg,#13102a,#0d0919);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;animation:fadeIn 0.25s}
  .pw-screen .back{position:absolute;top:16px;left:16px;background:none;border:none;color:var(--ts);font-size:16px;cursor:pointer;padding:8px}
  .pw-screen .av{font-size:56px;margin-bottom:8px}.pw-screen h2{font-size:20px;font-weight:700;margin-bottom:4px}
  .pw-screen .hint{color:var(--tm);font-size:13px;margin-bottom:24px;text-align:center}
  .pw-screen .fields{width:100%;max-width:300px;display:flex;flex-direction:column;gap:12px}
  .pw-screen input{width:100%;padding:14px 16px;background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,255,255,0.08);border-radius:14px;color:var(--tp);font-size:16px;text-align:center}
  .pw-screen .err{color:var(--rd);font-size:13px;text-align:center;min-height:18px}
  .pw-screen .btn{width:100%;padding:14px;border-radius:14px;border:none;font-size:15px;font-weight:700;color:#fff;cursor:pointer;transition:all 0.2s}

  /* APP */
  .app-shell{display:flex;min-height:100vh}
  .sidebar{display:none;width:220px;background:var(--bg-base);border-right:1px solid var(--brd);padding:24px 0;flex-shrink:0;position:fixed;top:0;bottom:0;left:0;z-index:101;flex-direction:column}
  .sidebar .logo{padding:0 20px 24px;font-size:17px;font-weight:800;letter-spacing:-0.02em}
  .sidebar .logo small{display:block;font-size:11px;font-weight:500;color:var(--tm);margin-top:2px}
  .sidebar-nav{list-style:none}
  .sidebar-nav li{padding:10px 20px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;color:var(--tm);transition:all 0.2s;border-left:3px solid transparent}
  .sidebar-nav li:hover{color:var(--tp);background:rgba(139,92,246,0.04)}
  .sidebar-nav li.active{color:var(--vl);background:rgba(139,92,246,0.08);border-left-color:var(--v);font-weight:600}
  .sidebar-nav li .ni{font-size:18px;width:24px;text-align:center}
  .sidebar .usec{position:absolute;bottom:0;left:0;right:0;padding:12px 20px;border-top:1px solid var(--brd)}
  .sidebar .uname{font-size:12px;color:var(--vl);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .sidebar .logout-btn{width:100%;padding:8px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03);color:var(--ts);font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:6px}
  .sidebar .logout-btn:hover{background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.3);color:var(--rd)}
  .main-content{flex:1;min-width:0}
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(to top,var(--bg-deep) 60%,rgba(13,9,25,0.95));backdrop-filter:blur(20px);display:flex;justify-content:space-around;padding:6px 0;padding-bottom:var(--sab);border-top:1px solid rgba(167,139,250,0.1);z-index:100}
  .nb{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 16px;cursor:pointer}
  .nb .ic{font-size:20px;transition:all 0.25s}.nb .lb{font-size:10px;font-weight:500;transition:color 0.25s;letter-spacing:0.04em}
  .nb.a .ic{filter:drop-shadow(0 0 6px var(--vg));color:var(--vl)}.nb.a .lb{color:var(--vl);font-weight:700}
  .nb:not(.a) .ic,.nb:not(.a) .lb{color:var(--td)}
  .card{background:var(--bg-card);border:1px solid var(--brd);border-radius:16px;padding:16px;backdrop-filter:blur(10px);transition:background 0.2s}
  .mn{display:flex;align-items:center;justify-content:center;gap:8px;padding:4px 0;user-select:none}
  .mn button{background:none;border:none;font-size:22px;padding:4px 10px;cursor:pointer;transition:color 0.2s;color:var(--vl)}
  .mn button:disabled{color:var(--tf);cursor:default}
  .mn .ml{font-size:15px;font-weight:600;min-width:140px;text-align:center}
  .fab{position:fixed;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--v),var(--vd));border:none;color:#fff;font-size:26px;box-shadow:0 4px 20px var(--vg);cursor:pointer;z-index:99;display:flex;align-items:center;justify-content:center;transition:transform 0.25s,background 0.25s}
  .fab.open{transform:rotate(45deg);background:linear-gradient(135deg,#6b21a8,#581c87)}
  .fm{position:fixed;z-index:98;display:flex;flex-direction:column;gap:8px;animation:fadeScale 0.15s ease-out}
  .fm button{padding:10px 16px;border-radius:12px;border:none;color:#fff;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .fo{position:fixed;inset:0;z-index:97}
  .mbg{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);z-index:200;display:flex;animation:fadeIn 0.2s ease-out}
  .mdl{background:linear-gradient(180deg,#1e1740,#13102a);width:100%;max-width:440px;padding:20px;max-height:90vh;overflow-y:auto;animation:slideUp 0.3s ease-out}
  .mdl h3{color:var(--tp);font-size:18px;font-weight:700}
  .mdl .cb{background:rgba(255,255,255,0.06);border:none;color:var(--ts);width:32px;height:32px;border-radius:10px;font-size:16px;cursor:pointer}
  .mdl label{font-size:11px;color:var(--ts);font-weight:600;letter-spacing:0.06em;margin-bottom:6px;display:block}
  .mdl input[type="number"],.mdl input[type="text"],.mdl input[type="date"]{width:100%;padding:12px 14px;background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,255,255,0.08);border-radius:14px;color:var(--tp);font-size:14px}
  .mdl input[type="number"]{font-size:22px;font-weight:700;padding-left:32px}
  .mdl input[type="date"]{color-scheme:dark}
  .ub,.ctb{border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;transition:all 0.2s;background:rgba(255,255,255,0.02);border:1.5px solid rgba(255,255,255,0.06)}
  .ub.sel{border-color:var(--v);background:rgba(139,92,246,0.12)}
  .ctb.sel{background:rgba(139,92,246,0.08)}
  .sb{width:100%;padding:14px;border-radius:14px;border:none;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.2s}
  .sb.ac{background:linear-gradient(135deg,var(--v),var(--vd));color:#fff;box-shadow:0 4px 16px rgba(139,92,246,0.3)}
  .sb:not(.ac){background:#2a2545;color:var(--td);cursor:default}
  .swc{position:relative;overflow:hidden;border-radius:14px;margin-bottom:6px}
  .swd{position:absolute;right:0;top:0;bottom:0;width:90px;background:linear-gradient(90deg,#dc2626,var(--rds));display:flex;align-items:center;justify-content:center;cursor:pointer}
  .swd span{color:#fff;font-size:13px;font-weight:600}
  .swi{position:relative;z-index:1;background:var(--bg-base);transition:transform 0.15s ease-out}
  .spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,0.1);border-top-color:var(--v);border-radius:50%;animation:spin 0.8s linear infinite;margin:40px auto}
  .empty{text-align:center;padding:40px 0;color:var(--td)}.empty .em{font-size:36px;margin-bottom:8px}
  .pb{height:5px;background:rgba(255,255,255,0.05);border-radius:4px;overflow:hidden}.pb .f{height:100%;border-radius:4px;transition:width 0.5s ease}
  .tb{border-radius:4px 4px 0 0;transition:height 0.5s ease}
  .edb{background:none;border:none;color:var(--vl);cursor:pointer;font-size:11px;padding:2px 6px;border-radius:6px;transition:background 0.2s;opacity:0.6}
  .edb:hover{background:rgba(139,92,246,0.15);opacity:1}
  .der{display:flex;align-items:center;gap:6px;margin-top:4px}
  .der input{padding:4px 8px;background:rgba(255,255,255,0.06);border:1px solid rgba(139,92,246,0.3);border-radius:8px;color:var(--tp);font-size:12px;color-scheme:dark}
  .der button{padding:4px 10px;border-radius:8px;border:none;font-size:11px;font-weight:600;cursor:pointer}
  .pdb{display:none;background:none;border:none;color:var(--rd);cursor:pointer;font-size:14px;padding:4px 8px;border-radius:8px;transition:background 0.2s;opacity:0.5}
  .pdb:hover{background:rgba(239,68,68,0.15);opacity:1}
  .mob-logout{background:none;border:none;color:var(--ts);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:8px;transition:all 0.2s}
  .mob-logout:hover{color:var(--rd);background:rgba(239,68,68,0.1)}

  /* SEARCH & FILTERS */
  .search-row{display:flex;gap:8px;margin-bottom:10px;margin-top:8px}
  .search-input{flex:1;padding:11px 14px;background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,255,255,0.08);border-radius:12px;color:var(--tp);font-size:14px;outline:none;transition:border-color 0.2s}
  .search-input:focus{border-color:rgba(139,92,246,0.4)}
  .fbtn{position:relative;width:44px;padding:0;background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,255,255,0.08);border-radius:12px;color:var(--ts);font-size:16px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center}
  .fbtn:hover{color:var(--tp);background:rgba(139,92,246,0.08);border-color:rgba(139,92,246,0.3)}
  .fbtn.on{color:var(--vl);background:rgba(139,92,246,0.1);border-color:rgba(139,92,246,0.35)}
  .fbtn .dot{position:absolute;top:-4px;right:-4px;background:var(--v);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
  .fpanel{background:var(--bg-card);border:1px solid var(--brd);border-radius:14px;padding:12px 14px;margin-bottom:10px;animation:fadeIn 0.15s}
  .fgroup{margin-bottom:10px}
  .fgroup:last-child{margin-bottom:0}
  .fgroup label{font-size:10px;color:var(--ts);font-weight:600;letter-spacing:0.08em;margin-bottom:6px;display:block}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:6px 10px;border-radius:10px;border:1.5px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03);color:var(--tm);font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s}
  .chip:hover{color:var(--tp);border-color:rgba(139,92,246,0.3)}
  .chip.sel{color:#fff;background:rgba(139,92,246,0.2);border-color:var(--v)}
  .clear-btn{margin-top:8px;width:100%;padding:8px;border-radius:10px;border:1px solid rgba(239,68,68,0.2);background:rgba(239,68,68,0.05);color:var(--rd);font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s}
  .clear-btn:hover{background:rgba(239,68,68,0.1)}
  .sr-info{font-size:11px;color:var(--tm);margin:4px 4px 8px;display:flex;align-items:center;gap:6px}


  .share-badge{display:inline-flex;align-items:center;justify-content:center;font-size:11px;padding:2px 6px;border-radius:6px;background:rgba(139,92,246,0.15);color:var(--vl);font-weight:600;margin-left:4px;flex-shrink:0}
  .toggle-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,255,255,0.08);border-radius:14px;cursor:pointer;transition:all 0.2s;margin-bottom:16px;user-select:none}
  .toggle-row:hover{background:rgba(255,255,255,0.055)}
  .toggle-row.on{background:rgba(139,92,246,0.1);border-color:rgba(139,92,246,0.3)}
  .toggle-sw{width:40px;height:22px;border-radius:11px;position:relative;flex-shrink:0;transition:background 0.2s;background:rgba(255,255,255,0.1)}
  .toggle-row.on .toggle-sw{background:var(--v)}
  .toggle-sw::after{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:2px;left:2px;transition:left 0.2s}
  .toggle-row.on .toggle-sw::after{left:20px}
  .toggle-txt{flex:1}
  .toggle-txt .t1{font-size:14px;font-weight:600;color:var(--tp);display:flex;align-items:center;gap:6px}
  .toggle-txt .t2{font-size:11px;color:var(--tm);margin-top:2px}

  /* FOTO RECIBO */
  .foto-area{margin-bottom:16px}
  .foto-btns{display:flex;gap:8px}
  .foto-btn{flex:1;padding:12px;border-radius:14px;border:2px dashed rgba(255,255,255,0.1);background:rgba(255,255,255,0.02);color:var(--ts);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:all 0.2s;font-size:12px;font-weight:600}
  .foto-btn:hover{border-color:rgba(139,92,246,0.3);background:rgba(139,92,246,0.05)}
  .foto-btn .fi{font-size:24px}
  .foto-preview{position:relative;margin-top:8px;border-radius:14px;overflow:hidden}
  .foto-preview img{width:100%;max-height:160px;object-fit:cover;border-radius:14px}
  .foto-preview .foto-rm{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,0.6);border:none;color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .receipt-badge{cursor:pointer;font-size:16px;flex-shrink:0;transition:transform 0.2s}
  .receipt-badge:hover{transform:scale(1.2)}
  /* Receipt viewer */
  .rv-bg{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn 0.2s}
  .rv-bg img{max-width:100%;max-height:85vh;border-radius:12px;object-fit:contain}
  .rv-close{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.1);border:none;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}

  @media(max-width:767px){.mdl{border-radius:24px 24px 0 0}.mbg{align-items:flex-end}.ca{padding:12px 16px 100px}.fab{bottom:76px;right:20px}.fm{bottom:136px;right:20px}}
  @media(min-width:768px){.sidebar{display:flex}.main-content{margin-left:220px}.bottom-nav{display:none!important}.ca{padding:20px 32px 40px;max-width:820px;margin:0 auto}.mdl{border-radius:20px}.mbg{align-items:center;justify-content:center}.fab{bottom:32px;right:32px;width:56px;height:56px;font-size:28px}.fm{bottom:96px;right:32px}.hmob{display:none!important}.pdb{display:inline-flex}.swd{display:none}.cg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cg .cf{grid-column:1/-1}}
  @media(min-width:1100px){.ca{max-width:900px;padding:24px 48px 40px}}
</style>
</head>

<script>
const SB_URL='https://dyuwugtgcwaccvbhqvih.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5dXd1Z3RnY3dhY2N2YmhxdmloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY5NDA0OTksImV4cCI6MjA4MjUxNjQ5OX0.RjdPmbJYMB6qRFFS1XsFlos-pRAULE4kV_Dr-VeRBbo';

// Usuarios hardcodeados (solo nombre/avatar para pantalla de login, no hay datos sensibles acá)
const LOGIN_USERS=[
  {name:'Ana',avatar:'👩',color:'#FF6B6B',email:'dra.analaurabarrios@gmail.com'},
  {name:'Sebastian',avatar:'👨',color:'#4ECDC4',email:'sebaf80@gmail.com'}
];

function esc(s){if(typeof s!=='string')return'';const m={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'};return s.replace(/[&<>"']/g,c=>m[c]);}
function san(s,x=200){if(typeof s!=='string')return'';return s.replace(/[<>{}]/g,'').trim().slice(0,x);}
function sanA(v){const n=parseFloat(v);if(isNaN(n)||n<0||n>99999999)return null;return Math.round(n*100)/100;}

// ============================================
// AUTH (Supabase Auth) - Sesión en localStorage
// ============================================
const SESSION_KEY='gastosapp_session_v2';

function saveSession(s){try{localStorage.setItem(SESSION_KEY,JSON.stringify({access_token:s.access_token,refresh_token:s.refresh_token,expires_at:s.expires_at,user_id:s.user?.id,email:s.user?.email}));}catch(e){console.error('saveSession:',e);}}
function loadSession(){try{const s=localStorage.getItem(SESSION_KEY);return s?JSON.parse(s):null;}catch{return null;}}
function clearSession(){try{localStorage.removeItem(SESSION_KEY);}catch{}}

async function authLogin(email,password){
  const r=await fetch(`${SB_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
  const d=await r.json();
  if(!r.ok)throw new Error(d.error_description||d.msg||d.message||'Error de login');
  saveSession(d);return d;
}
async function authRefresh(){
  const s=loadSession();if(!s?.refresh_token)throw new Error('No session');
  const r=await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});
  const d=await r.json();
  if(!r.ok){clearSession();throw new Error('Refresh failed');}
  saveSession(d);return d;
}
async function authLogout(){
  const s=loadSession();
  if(s?.access_token){try{await fetch(`${SB_URL}/auth/v1/logout`,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':`Bearer ${s.access_token}`}});}catch{}}
  clearSession();
}
async function getAccessToken(){
  const s=loadSession();if(!s)return null;
  // Si expira en menos de 60s, refrescar
  if(s.expires_at && s.expires_at*1000 < Date.now()+60000){
    try{const ns=await authRefresh();return ns.access_token;}catch{return null;}
  }
  return s.access_token;
}

async function sbf(t,m='GET',b=null,q=''){
  const token=await getAccessToken();
  const u=`${SB_URL}/rest/v1/${t}${q}`;
  const h={'apikey':SB_KEY,'Authorization':`Bearer ${token||SB_KEY}`,'Content-Type':'application/json'};
  if(m==='POST'||m==='PATCH')h['Prefer']='return=representation';
  try{
    const r=await fetch(u,{method:m,headers:h,body:b?JSON.stringify(b):undefined});
    if(r.status===401){clearSession();S.session=null;S.cu=null;S.screen='login';R();return null;}
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    const x=await r.text();return x?JSON.parse(x):[];
  }catch(e){console.error(`SB[${t}]:`,e);return null;}
}

// IMAGEN: comprimir y convertir a base64
// ============================================
function compressImage(file, maxW=800, quality=0.6){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=function(e){
      const img=new Image();
      img.onload=function(){
        const canvas=document.createElement('canvas');
        let w=img.width,h=img.height;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

const MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function gc(id){return CATS.find(c=>c.id===id)||{i:'📦',n:'Otro',c:'#6b7280'};}
function gi(id){return INCT.find(t=>t.id===id)||{i:'📥',n:'Otro',c:'#6b7280'};}
function fmt(n){return'$'+(Number(n)||0).toLocaleString('es-UY',{minimumFractionDigits:0,maximumFractionDigits:0});}
function mkM(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}
function ml(k){const[y,m]=k.split('-');return`${MES[parseInt(m)-1]} ${y}`;}
function mR(){const now=new Date(),a=[];for(let i=23;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);a.push(mkM(d));}return a;}
function dl(d){return new Date(d+'T12:00:00').toLocaleDateString('es-UY',{weekday:'short',day:'numeric',month:'short'}).toUpperCase();}
function accBal(upTo){let b=0;for(const m of mR()){if(m>=upTo)break;b+=S.incomes.filter(i=>i.date?.startsWith(m)).reduce((s,i)=>s+Number(i.amount),0);b-=S.expenses.filter(e=>e.date?.startsWith(m)).reduce((s,e)=>s+Number(e.amount),0);}return b;}

// Balance de gastos compartidos (acumulativo histórico)
function calcSharedBal(){
  if(S.users.length!==2)return null;
  const byU={};S.users.forEach(u=>byU[u.id]=0);
  S.expenses.filter(e=>e.shared).forEach(e=>{if(byU[e.user_id]!==undefined)byU[e.user_id]+=Number(e.amount);});
  const[u1,u2]=S.users;
  const p1=byU[u1.id]||0,p2=byU[u2.id]||0;
  if(p1===0&&p2===0)return null;
  const diff=p1-p2;
  if(diff===0)return{balanced:true,u1,u2,p1,p2};
  return diff>0?{debtor:u2,creditor:u1,amount:diff/2,u1,u2,p1,p2}:{debtor:u1,creditor:u2,amount:-diff/2,u1,u2,p1,p2};
}

                <div style="font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.description||ct.n)}${isE&&it.shared?'<span class="share-badge">🤝 50/50</span>':''}</div>
                <div style="font-size:11px;color:var(--tm);margin-top:1px;display:flex;align-items:center;gap:4px;flex-wrap:wrap">
                  ${us?us.avatar+' '+esc(us.name)+' ·':''} ${ct.n}
                  <button class="edb" onclick="event.stopPropagation();tgEd('${it.id}')" title="Editar fecha">📅 ${it.date}</button></div>
                ${ed?`<div class="der" onclick="event.stopPropagation()"><input type="date" id="de-${it.id}" value="${it.date}">
                  <button onclick="svDt('${it.id}','${type}')" style="background:var(--v);color:#fff">✓</button>
                  <button onclick="S.ed=null;R()" style="background:rgba(255,255,255,0.06);color:var(--tm)">✕</button></div>`:''}</div>
              ${hasR?`<span class="receipt-badge" onclick="event.stopPropagation();viewReceipt('${it.receipt_url.replace(/'/g,"\\'")}')">🧾</span>`:''}
              <div style="font-size:16px;font-weight:700;color:${isE?'var(--or)':'var(--gr)'};flex-shrink:0">${fmt(it.amount)}</div>
              <button class="pdb" onclick="del('${it.id}','${type}')" title="Eliminar">🗑</button>
            </div></div></div></div>`;}).join('')}
    </div>`).join('')}
    ${fl.length===0?`<div class="empty"><div class="em">${hasF?'🔍':(isE?'💸':'💰')}</div><div style="font-size:14px">${hasF?'Sin resultados':'No hay '+(isE?'gastos':'ingresos')+' este mes'}</div></div>`:''}
  </div>`;
}

function rSt(){
  const mE=S.expenses.filter(e=>e.date?.startsWith(S.m)),mI=S.incomes.filter(i=>i.date?.startsWith(S.m));
  const tE=mE.reduce((s,e)=>s+Number(e.amount),0),tI=mI.reduce((s,i)=>s+Number(i.amount),0);
  const pB=accBal(S.m),sP=tI>0?Math.round((tI-tE)/tI*100):0;
  const now=new Date(),tr=[];
  for(let j=5;j>=0;j--){const d=new Date(now.getFullYear(),now.getMonth()-j,1);const m=mkM(d);
    tr.push({l:MES[d.getMonth()].slice(0,3),e:S.expenses.filter(x=>x.date?.startsWith(m)).reduce((s,x)=>s+Number(x.amount),0),i:S.incomes.filter(x=>x.date?.startsWith(m)).reduce((s,x)=>s+Number(x.amount),0)});}
  const mx=Math.max(...tr.map(t=>Math.max(t.e,t.i)),1);
  const bC={};mE.forEach(e=>{bC[e.category]=(bC[e.category]||0)+Number(e.amount);});const sC=Object.entries(bC).sort((a,b)=>b[1]-a[1]);
  const bU={};mE.forEach(e=>{bU[e.user_id]=(bU[e.user_id]||0)+Number(e.amount);});
  return`<div class="ca">${rMN()}
    <div class="cg" style="margin-top:12px">
      <div class="card cf"><div style="font-size:11px;color:var(--ts);font-weight:600;letter-spacing:0.06em;margin-bottom:12px">RESUMEN MENSUAL</div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
          <div style="text-align:center"><div style="font-size:10px;color:var(--tm);font-weight:600">Anterior</div><div style="font-size:14px;font-weight:700;color:${pB>=0?'#a5f3ab':'var(--rd)'}">${fmt(pB)}</div></div>
          <div style="text-align:center"><div style="font-size:10px;color:var(--gr);font-weight:600">Ingresos</div><div style="font-size:14px;font-weight:700;color:var(--gr)">${fmt(tI)}</div></div>
          <div style="text-align:center"><div style="font-size:10px;color:var(--or);font-weight:600">Gastos</div><div style="font-size:14px;font-weight:700;color:var(--or)">${fmt(tE)}</div></div>
          <div style="text-align:center"><div style="font-size:10px;color:var(--vl);font-weight:600">Ahorro</div><div style="font-size:14px;font-weight:700;color:${sP>=0?'#a5f3ab':'var(--rd)'}">${sP}%</div></div></div></div>
      <div class="card cf"><div style="font-size:11px;color:var(--ts);font-weight:600;letter-spacing:0.06em;margin-bottom:14px">TENDENCIA 6 MESES</div>
        <div style="display:flex;align-items:flex-end;gap:6px;height:100px">
          ${tr.map(t=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px"><div style="width:100%;display:flex;gap:2px;align-items:flex-end;justify-content:center;height:80px">
              <div class="tb" style="width:40%;background:linear-gradient(to top,rgba(16,185,129,0.3),rgba(16,185,129,0.6));height:${(t.i/mx)*100}%;min-height:${t.i>0?4:0}px"></div>
              <div class="tb" style="width:40%;background:linear-gradient(to top,rgba(249,115,22,0.3),rgba(249,115,22,0.6));height:${(t.e/mx)*100}%;min-height:${t.e>0?4:0}px"></div>
            </div><span style="font-size:9px;color:var(--tm);font-weight:600">${t.l}</span></div>`).join('')}
        </div>
        <div style="display:flex;justify-content:center;gap:16px;margin-top:10px">
          <div style="display:flex;align-items:center;gap:4px"><div style="width:8px;height:8px;border-radius:2px;background:rgba(16,185,129,0.6)"></div><span style="font-size:10px;color:var(--tm)">Ingresos</span></div>
          <div style="display:flex;align-items:center;gap:4px"><div style="width:8px;height:8px;border-radius:2px;background:rgba(249,115,22,0.6)"></div><span style="font-size:10px;color:var(--tm)">Gastos</span></div></div></div>
      ${sC.length?`<div class="card"><div style="font-size:11px;color:var(--ts);font-weight:600;letter-spacing:0.06em;margin-bottom:10px">POR CATEGORÍA</div>
        ${sC.map(([id,amt])=>{const c=gc(id);const p=tE>0?Math.round(amt/tE*100):0;return`<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
            <div style="width:36px;height:36px;border-radius:10px;background:${c.c}15;display:flex;align-items:center;justify-content:center;font-size:18px">${c.i}</div>
            <div style="flex:1"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:12px;color:var(--vl);font-weight:600">${c.n}</span><span style="font-size:12px;font-weight:700">${fmt(amt)} <span style="color:var(--tm);font-weight:500">(${p}%)</span></span></div>
            <div class="pb"><div class="f" style="width:${p}%;background:${c.c}"></div></div></div></div>`;}).join('')}</div>`:''}
      ${S.users.length&&Object.keys(bU).length?`<div class="card"><div style="font-size:11px;color:var(--ts);font-weight:600;letter-spacing:0.06em;margin-bottom:10px">POR PERSONA</div>
        ${S.users.map(u=>{const amt=bU[u.id]||0;const p=tE>0?Math.round(amt/tE*100):0;return`<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
            <span style="font-size:24px">${u.avatar}</span><div style="flex:1"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:12px;color:var(--vl);font-weight:600">${esc(u.name)}</span><span style="font-size:12px;font-weight:700">${fmt(amt)}</span></div>
            <div class="pb"><div class="f" style="width:${p}%;background:${u.color}"></div></div></div></div>`;}).join('')}</div>`:''}
    </div></div>`;
}

// FAB & MODAL
function rFab(){let h='';const isPC=window.innerWidth>=768;
  if(S.fo){h+=`<div class="fo" onclick="tgF()"></div><div class="fm" style="bottom:${isPC?'96px':'136px'};right:${isPC?'32px':'20px'}">
    <button onclick="oM('income')" style="background:linear-gradient(135deg,#059669,#10b981);box-shadow:0 4px 12px rgba(16,185,129,0.3)">💰 Ingreso</button>
    <button onclick="oM('expense')" style="background:linear-gradient(135deg,#ea580c,#f97316);box-shadow:0 4px 12px rgba(249,115,22,0.3)">💸 Gasto</button></div>`;}
  h+=`<button class="fab ${S.fo?'open':''}" onclick="tgF()">+</button>`;return h;}

function rMdl(){
  if(!S.md)return'';const isE=S.md==='expense',its=isE?CATS:INCT;
  return`<div class="mbg" onclick="if(event.target===this)cM()"><div class="mdl">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h3>${isE?'Nuevo Gasto':'Nuevo Ingreso'}</h3>
      <button class="cb" onclick="cM()">✕</button></div>
    <label>MONTO</label>
    <div style="position:relative;margin-bottom:16px"><span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ts);font-size:18px;font-weight:700">$</span>
      <input type="number" id="ma" inputmode="decimal" placeholder="0" autocomplete="off"></div>
    <label>DESCRIPCIÓN</label>
    <input type="text" id="mde" placeholder="¿En qué?" maxlength="200" autocomplete="off" style="margin-bottom:16px">
    <label>${isE?'CATEGORÍA':'TIPO'}</label>
    <div id="mc" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px">
      ${its.map((c,j)=>`<button class="ctb ${j===0?'sel':''}" data-cat="${c.id}" onclick="sC('${c.id}')" style="padding:10px 4px;gap:3px;${j===0?`border-color:${c.c};background:${c.c}15`:''}" data-color="${c.c}">
        <span style="font-size:20px">${c.i}</span><span style="font-size:9px;color:var(--ts);font-weight:600">${c.n}</span></button>`).join('')}</div>
    ${isE?`<label>RECIBO / COMPROBANTE</label>
    <div class="foto-area">
      ${pendingReceipt?`<div class="foto-preview"><img src="${pendingReceipt}" alt="Recibo"><button class="foto-rm" onclick="removeReceipt()">✕</button></div>`
      :`<div class="foto-btns">
        <button class="foto-btn" onclick="openCamera()"><span class="fi">📸</span>Sacar foto</button>
        <button class="foto-btn" onclick="openGallery()"><span class="fi">🖼️</span>Galería</button>
      </div>`}
    </div>
    ${S.users.length===2?`<div class="toggle-row ${pendingShared?'on':''}" onclick="togShared()">
      <div class="toggle-sw"></div>
      <div class="toggle-txt">
        <div class="t1">🤝 Compartido 50/50</div>
        <div class="t2">${pendingShared?'Se divide con '+esc(S.users.find(u=>u.id!==S.cu?.id)?.name||'el otro'):'Gasto propio (no se divide)'}</div>
      </div>
    </div>`:''}`:''}
    <label>FECHA</label>
    <input type="date" id="mf" value="${new Date().toISOString().split('T')[0]}" style="margin-bottom:20px">
    <button class="sb" id="ms" onclick="svI()">Guardar</button>
  </div></div>`;
}

function rBN(){const its=[{id:'home',ic:'⌂',l:'Inicio'},{id:'expenses',ic:'↗',l:'Gastos'},{id:'income',ic:'↙',l:'Ingresos'},{id:'stats',ic:'◔',l:'Stats'}];
  return`<nav class="bottom-nav">${its.map(it=>`<button class="nb ${S.v===it.id?'a':''}" onclick="nav('${it.id}')"><span class="ic">${it.ic}</span><span class="lb">${it.l}</span></button>`).join('')}</nav>`;}

// ACCIONES
function nav(v){
  // Al cambiar entre gastos/ingresos se resetea el filtro de categoría porque las categorías son distintas
  if((v==='expenses'&&S.v==='income')||(v==='income'&&S.v==='expenses'))S.fc=null;
  // Al salir de listas, cerrar el panel de filtros
  if(v!=='expenses'&&v!=='income')S.fp=false;
  S.v=v;S.ed=null;R();window.scrollTo(0,0);
}
function togFp(){S.fp=!S.fp;R();}
function stFu(id){S.fu=id;R();}
function stFc(id){S.fc=id;R();}
function clrF(){S.sq='';S.fu=null;S.fc=null;R();}
function tgF(){S.fo=!S.fo;R();}
function oM(t){S.md=t;S.fo=false;pendingReceipt=null;pendingShared=false;R();}
function cM(){S.md=null;pendingReceipt=null;pendingShared=false;R();}
function chM(d){const ms=mR(),ix=ms.indexOf(S.m),ni=ix+d;if(ni>=0&&ni<ms.length){S.m=ms[ni];S.ed=null;R();}}

let scId=null;
function sC(id){scId=id;document.querySelectorAll('#mc .ctb').forEach(b=>{const a=b.dataset.cat===id;b.classList.toggle('sel',a);b.style.borderColor=a?b.dataset.color:'rgba(255,255,255,0.06)';b.style.background=a?b.dataset.color+'15':'rgba(255,255,255,0.02)';});}

async function svI(){
  const el=document.getElementById('ma');if(!el)return;
  const amt=sanA(el.value);if(!amt||!S.cu)return;
  const desc=san(document.getElementById('mde')?.value||''),date=document.getElementById('mf')?.value||new Date().toISOString().split('T')[0];
  const isE=S.md==='expense',cat=scId||(isE?'food':'salary');
  const btn=document.getElementById('ms');if(btn){btn.textContent='Guardando...';btn.style.opacity='0.6';}
  if(isE){
    const body={user_id:S.cu.id,amount:amt,description:desc,category:cat,date,shared:pendingShared};
    if(pendingReceipt)body.receipt_url=pendingReceipt;
    const r=await sbf('expenses','POST',body);if(r?.[0])S.expenses.unshift(r[0]);
  }else{
    const r=await sbf('incomes','POST',{user_id:S.cu.id,amount:amt,description:desc,type:cat,date});if(r?.[0])S.incomes.unshift(r[0]);
  }
  scId=null;pendingReceipt=null;pendingShared=false;cM();
}

async function del(id,type){if(!confirm('¿Eliminar este registro?'))return;
  if(type==='expense'){await sbf('expenses','DELETE',null,`?id=eq.${id}`);S.expenses=S.expenses.filter(e=>e.id!==id);}
  else{await sbf('incomes','DELETE',null,`?id=eq.${id}`);S.incomes=S.incomes.filter(i=>i.id!==id);}R();}
function tgEd(id){S.ed=S.ed===id?null:id;R();setTimeout(()=>{const inp=document.getElementById('de-'+id);if(inp)inp.focus();},50);}
async function svDt(id,type){const inp=document.getElementById('de-'+id);if(!inp||!inp.value)return;
  const nd=inp.value,tbl=type==='expense'?'expenses':'incomes';
  const r=await sbf(tbl,'PATCH',{date:nd},`?id=eq.${id}`);if(r){const arr=type==='expense'?S.expenses:S.incomes;const it=arr.find(e=>e.id===id);if(it)it.date=nd;}S.ed=null;R();}

function bEv(){
  document.querySelectorAll('.swi').forEach(el=>{let sx=0,cx=0,sw=false;
    el.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sw=true;});
    el.addEventListener('touchmove',e=>{if(!sw)return;const d=Math.min(0,e.touches[0].clientX-sx);cx=d;el.style.transform=`translateX(${Math.max(d,-90)}px)`;});
    el.addEventListener('touchend',()=>{sw=false;el.style.transform=cx<-50?'translateX(-90px)':'translateX(0)';cx=0;});});
  const ai=document.getElementById('ma');
  if(ai){const ub=()=>{const b=document.getElementById('ms');if(!b)return;b.classList.toggle('ac',sanA(ai.value)!==null);};ai.addEventListener('input',ub);ub();}
}

async function loadData(){
  S.ld=true;R();
  const[ud,ed,id]=await Promise.all([
    sbf('users','GET',null,'?select=*&order=name.asc'),
    sbf('expenses','GET',null,'?select=*&order=created_at.desc'),
    sbf('incomes','GET',null,'?select=*&order=created_at.desc')
  ]);
  if(ud)S.users=ud;
  if(ed)S.expenses=ed;
  if(id)S.incomes=id;
  if(S.session?.user_id)S.cu=S.users.find(u=>u.id===S.session.user_id)||null;
  S.ld=false;R();
}

async function init(){
  R();
  const s=loadSession();
  if(s){
    const valid=s.expires_at && s.expires_at*1000 > Date.now()+60000;
    if(valid){S.session=s;S.screen='app';await loadData();return;}
    // Intentar refrescar
    try{await authRefresh();S.session=loadSession();S.screen='app';await loadData();return;}catch{}
  }
  S.screen='login';R();
}
init();
</script>
</body>
</html>
