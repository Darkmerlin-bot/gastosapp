<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#13102a">
<title>Control de Gastos</title>
<style>
  :root {
    --bg-deep: #0d0919;
    --bg-base: #13102a;
    --bg-card: rgba(255,255,255,0.03);
    --bg-card-hover: rgba(255,255,255,0.055);
    --border-card: rgba(167,139,250,0.08);
    --violet: #8b5cf6;
    --violet-dark: #6d28d9;
    --violet-light: #c4b5fd;
    --violet-glow: rgba(139,92,246,0.4);
    --text-primary: #e2e0ff;
    --text-secondary: #8b82a8;
    --text-muted: #6b6490;
    --text-dim: #5b5280;
    --text-faint: #3f3561;
    --green: #6ee7b7;
    --green-bg: rgba(16,185,129,0.08);
    --orange: #fdba74;
    --orange-bg: rgba(249,115,22,0.08);
    --red: #fca5a5;
    --red-solid: #ef4444;
    --safe-bottom: env(safe-area-inset-bottom, 12px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg-deep);color:var(--text-primary);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(139,92,246,0.2);border-radius:3px}
  input,button,select{font-family:inherit}input::placeholder{color:var(--text-dim)}input:focus{border-color:rgba(139,92,246,0.4)!important;outline:none}

  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @keyframes fadeScale{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}

  .app-shell{display:flex;min-height:100vh}

  /* SIDEBAR PC */
  .sidebar{display:none;width:220px;background:var(--bg-base);border-right:1px solid rgba(167,139,250,0.08);padding:24px 0;flex-shrink:0;position:fixed;top:0;bottom:0;left:0;z-index:101;flex-direction:column}
  .sidebar .logo{padding:0 20px 24px;font-size:17px;font-weight:800;letter-spacing:-0.02em}
  .sidebar .logo small{display:block;font-size:11px;font-weight:500;color:var(--text-muted);margin-top:2px}
  .sidebar-nav{list-style:none}
  .sidebar-nav li{padding:10px 20px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;color:var(--text-muted);transition:all 0.2s;border-left:3px solid transparent}
  .sidebar-nav li:hover{color:var(--text-primary);background:rgba(139,92,246,0.04)}
  .sidebar-nav li.active{color:var(--violet-light);background:rgba(139,92,246,0.08);border-left-color:var(--violet);font-weight:600}
  .sidebar-nav li .ni{font-size:18px;width:24px;text-align:center}
  .sidebar .usec{position:absolute;bottom:0;left:0;right:0;padding:16px 20px;border-top:1px solid rgba(167,139,250,0.08)}
  .sidebar .usec .ubs{display:flex;gap:6px}
  .sidebar .usec .ubs button{width:38px;height:38px;border-radius:10px;font-size:18px;cursor:pointer;border:1.5px solid transparent;background:rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:center;transition:all 0.2s}
  .sidebar .usec .ubs button.sel{background:rgba(139,92,246,0.2);border-color:rgba(139,92,246,0.4)}

  .main-content{flex:1;min-width:0}

  /* BOTTOM NAV MOBILE */
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(to top,var(--bg-deep) 60%,rgba(13,9,25,0.95));backdrop-filter:blur(20px);display:flex;justify-content:space-around;padding:6px 0;padding-bottom:var(--safe-bottom);border-top:1px solid rgba(167,139,250,0.1);z-index:100}
  .nb{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 16px;cursor:pointer}
  .nb .ic{font-size:20px;transition:all 0.25s}.nb .lb{font-size:10px;font-weight:500;transition:color 0.25s;letter-spacing:0.04em}
  .nb.a .ic{filter:drop-shadow(0 0 6px var(--violet-glow));color:var(--violet-light)}.nb.a .lb{color:var(--violet-light);font-weight:700}
  .nb:not(.a) .ic,.nb:not(.a) .lb{color:var(--text-dim)}

  .card{background:var(--bg-card);border:1px solid var(--border-card);border-radius:16px;padding:16px;backdrop-filter:blur(10px);transition:background 0.2s}

  .mn{display:flex;align-items:center;justify-content:center;gap:8px;padding:4px 0;user-select:none}
  .mn button{background:none;border:none;font-size:22px;padding:4px 10px;cursor:pointer;transition:color 0.2s;color:var(--violet-light)}
  .mn button:disabled{color:var(--text-faint);cursor:default}
  .mn .ml{font-size:15px;font-weight:600;min-width:140px;text-align:center}

  .fab{position:fixed;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--violet-dark));border:none;color:#fff;font-size:26px;box-shadow:0 4px 20px var(--violet-glow);cursor:pointer;z-index:99;display:flex;align-items:center;justify-content:center;transition:transform 0.25s,background 0.25s}
  .fab.open{transform:rotate(45deg);background:linear-gradient(135deg,#6b21a8,#581c87)}
  .fm{position:fixed;z-index:98;display:flex;flex-direction:column;gap:8px;animation:fadeScale 0.15s ease-out}
  .fm button{padding:10px 16px;border-radius:12px;border:none;color:#fff;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .fo{position:fixed;inset:0;z-index:97}

  .mbg{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);z-index:200;display:flex;animation:fadeIn 0.2s ease-out}
  .mdl{background:linear-gradient(180deg,#1e1740,#13102a);width:100%;max-width:440px;padding:20px;max-height:90vh;overflow-y:auto;animation:slideUp 0.3s ease-out}
  .mdl h3{color:var(--text-primary);font-size:18px;font-weight:700}
  .mdl .cb{background:rgba(255,255,255,0.06);border:none;color:var(--text-secondary);width:32px;height:32px;border-radius:10px;font-size:16px;cursor:pointer}
  .mdl label{font-size:11px;color:var(--text-secondary);font-weight:600;letter-spacing:0.06em;margin-bottom:6px;display:block}
  .mdl input[type="number"],.mdl input[type="text"],.mdl input[type="date"]{width:100%;padding:12px 14px;background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,255,255,0.08);border-radius:14px;color:var(--text-primary);font-size:14px}
  .mdl input[type="number"]{font-size:22px;font-weight:700;padding-left:32px}
  .mdl input[type="date"]{color-scheme:dark}

  .ub,.ctb{border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;transition:all 0.2s;background:rgba(255,255,255,0.02);border:1.5px solid rgba(255,255,255,0.06)}
  .ub.sel{border-color:var(--violet);background:rgba(139,92,246,0.12)}
  .ctb.sel{background:rgba(139,92,246,0.08)}

  .sb{width:100%;padding:14px;border-radius:14px;border:none;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.2s}
  .sb.ac{background:linear-gradient(135deg,var(--violet),var(--violet-dark));color:#fff;box-shadow:0 4px 16px rgba(139,92,246,0.3)}
  .sb:not(.ac){background:#2a2545;color:var(--text-dim);cursor:default}

  .swc{position:relative;overflow:hidden;border-radius:14px;margin-bottom:6px}
  .swd{position:absolute;right:0;top:0;bottom:0;width:90px;background:linear-gradient(90deg,#dc2626,var(--red-solid));display:flex;align-items:center;justify-content:center;cursor:pointer}
  .swd span{color:#fff;font-size:13px;font-weight:600}
  .swi{position:relative;z-index:1;background:var(--bg-base);transition:transform 0.15s ease-out}

  .spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,0.1);border-top-color:var(--violet);border-radius:50%;animation:spin 0.8s linear infinite;margin:40px auto}
  .empty{text-align:center;padding:40px 0;color:var(--text-dim)}.empty .em{font-size:36px;margin-bottom:8px}
  .pb{height:5px;background:rgba(255,255,255,0.05);border-radius:4px;overflow:hidden}.pb .f{height:100%;border-radius:4px;transition:width 0.5s ease}
  .tb{border-radius:4px 4px 0 0;transition:height 0.5s ease}

  .edb{background:none;border:none;color:var(--violet-light);cursor:pointer;font-size:11px;padding:2px 6px;border-radius:6px;transition:background 0.2s;opacity:0.6}
  .edb:hover{background:rgba(139,92,246,0.15);opacity:1}
  .der{display:flex;align-items:center;gap:6px;margin-top:4px}
  .der input{padding:4px 8px;background:rgba(255,255,255,0.06);border:1px solid rgba(139,92,246,0.3);border-radius:8px;color:var(--text-primary);font-size:12px;color-scheme:dark}
  .der button{padding:4px 10px;border-radius:8px;border:none;font-size:11px;font-weight:600;cursor:pointer}

  .pdb{display:none;background:none;border:none;color:var(--red);cursor:pointer;font-size:14px;padding:4px 8px;border-radius:8px;transition:background 0.2s;opacity:0.5}
  .pdb:hover{background:rgba(239,68,68,0.15);opacity:1}

  /* RESPONSIVE */
  @media(max-width:767px){
    .mdl{border-radius:24px 24px 0 0}.mbg{align-items:flex-end}.ca{padding:12px 16px 100px}
    .fab{bottom:76px;right:20px}.fm{bottom:136px;right:20px}
  }
  @media(min-width:768px){
    .sidebar{display:flex}.main-content{margin-left:220px}.bottom-nav{display:none!important}
    .ca{padding:20px 32px 40px;max-width:820px;margin:0 auto}
    .mdl{border-radius:20px}.mbg{align-items:center;justify-content:center}
    .fab{bottom:32px;right:32px;width:56px;height:56px;font-size:28px}
    .fm{bottom:96px;right:32px}
    .hmob{display:none!important}.pdb{display:inline-flex}.swd{display:none}
    .cg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cg .cf{grid-column:1/-1}
  }
  @media(min-width:1100px){.ca{max-width:900px;padding:24px 48px 40px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SB_URL='https://dyuwugtgcwaccvbhqvih.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5dXd1Z3RnY3dhY2N2YmhxdmloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY5NDA0OTksImV4cCI6MjA4MjUxNjQ5OX0.RjdPmbJYMB6qRFFS1XsFlos-pRAULE4kV_Dr-VeRBbo';

function esc(s){if(typeof s!=='string')return'';const m={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'};return s.replace(/[&<>"']/g,c=>m[c]);}
function san(s,x=200){if(typeof s!=='string')return'';return s.replace(/[<>{}]/g,'').trim().slice(0,x);}
function sanA(v){const n=parseFloat(v);if(isNaN(n)||n<0||n>99999999)return null;return Math.round(n*100)/100;}

async function sb(t,m='GET',b=null,q=''){
  const u=`${SB_URL}/rest/v1/${t}${q}`,h={'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json'};
  if(m==='POST'||m==='PATCH')h['Prefer']='return=representation';
  try{const r=await fetch(u,{method:m,headers:h,body:b?JSON.stringify(b):undefined});if(!r.ok)throw new Error(`HTTP ${r.status}`);const x=await r.text();return x?JSON.parse(x):[];}catch(e){console.error(`SB[${t}]:`,e);return null;}
}

const CATS=[{id:'food',n:'Comida',i:'🍔',c:'#f97316'},{id:'transport',n:'Transporte',i:'🚗',c:'#06b6d4'},{id:'shopping',n:'Compras',i:'🛍️',c:'#ec4899'},{id:'entertainment',n:'Ocio',i:'🎬',c:'#8b5cf6'},{id:'health',n:'Salud',i:'💊',c:'#10b981'},{id:'home',n:'Hogar',i:'🏠',c:'#f59e0b'},{id:'services',n:'Servicios',i:'📱',c:'#3b82f6'},{id:'other',n:'Otros',i:'📦',c:'#6b7280'}];
const INCT=[{id:'salary',n:'Sueldo',i:'💰',c:'#10b981'},{id:'freelance',n:'Extra',i:'💼',c:'#06b6d4'},{id:'transfer',n:'Transferencia',i:'🔄',c:'#3b82f6'},{id:'other',n:'Otro',i:'📥',c:'#6b7280'}];
const MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function gc(id){return CATS.find(c=>c.id===id)||{i:'📦',n:'Otro',c:'#6b7280'};}
function gi(id){return INCT.find(t=>t.id===id)||{i:'📥',n:'Otro',c:'#6b7280'};}
function fmt(n){return'$'+(Number(n)||0).toLocaleString('es-UY',{minimumFractionDigits:0,maximumFractionDigits:0});}
function mk(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}
function ml(k){const[y,m]=k.split('-');return`${MES[parseInt(m)-1]} ${y}`;}
function mR(){const now=new Date(),a=[];for(let i=23;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);a.push(mk(d));}return a;}
function dl(d){return new Date(d+'T12:00:00').toLocaleDateString('es-UY',{weekday:'short',day:'numeric',month:'short'}).toUpperCase();}

// Balance acumulado hasta (sin incluir) el mes dado
function accBal(upTo){
  let b=0;for(const m of mR()){if(m>=upTo)break;
    b+=S.incomes.filter(i=>i.date?.startsWith(m)).reduce((s,i)=>s+Number(i.amount),0);
    b-=S.expenses.filter(e=>e.date?.startsWith(m)).reduce((s,e)=>s+Number(e.amount),0);
  }return b;
}

const S={users:[],cu:null,expenses:[],incomes:[],v:'home',m:mk(new Date()),ld:true,fo:false,md:null,ed:null};

function R(){
  document.getElementById('app').innerHTML=`<div class="app-shell">${rSB()}<div class="main-content">${rHM()}${S.ld?'<div class="spinner"></div>':rV()}${rFab()}${rMdl()}</div></div>${rBN()}`;
  bEv();
}

function rSB(){
  const nv=[{id:'home',ic:'⌂',l:'Inicio'},{id:'expenses',ic:'↗',l:'Gastos'},{id:'income',ic:'↙',l:'Ingresos'},{id:'stats',ic:'◔',l:'Estadísticas'}];
  return`<aside class="sidebar"><div class="logo">Control de Gastos<small>${S.cu?S.cu.avatar+' '+esc(S.cu.name):''}</small></div>
    <ul class="sidebar-nav">${nv.map(n=>`<li class="${S.v===n.id?'active':''}" onclick="nav('${n.id}')"><span class="ni">${n.ic}</span>${n.l}</li>`).join('')}</ul>
    <div class="usec"><div style="font-size:10px;color:var(--text-muted);font-weight:600;letter-spacing:0.06em;margin-bottom:8px">USUARIO</div>
    <div class="ubs">${S.users.map(u=>`<button class="${S.cu?.id===u.id?'sel':''}" onclick="swU('${u.id}')" title="${esc(u.name)}">${u.avatar}</button>`).join('')}</div></div></aside>`;
}

function rHM(){
  return`<div class="hmob" style="padding:16px 20px 10px;display:flex;align-items:center;justify-content:space-between">
    <div><div style="font-size:20px;font-weight:800;letter-spacing:-0.02em">Control de Gastos</div>
    <div style="font-size:11px;color:var(--text-muted);margin-top:1px">${S.cu?S.cu.avatar+' '+esc(S.cu.name):''}</div></div>
    <div style="display:flex;gap:4px">${S.users.map(u=>`<button onclick="swU('${u.id}')" style="width:34px;height:34px;border-radius:10px;background:${S.cu?.id===u.id?'rgba(139,92,246,0.2)':'rgba(255,255,255,0.04)'};border:${S.cu?.id===u.id?'1.5px solid rgba(139,92,246,0.4)':'1.5px solid transparent'};font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center">${u.avatar}</button>`).join('')}</div></div>`;
}

function rMN(){
  const ms=mR(),ix=ms.indexOf(S.m);
  return`<div class="mn"><button ${ix<=0?'disabled':''} onclick="chM(-1)">‹</button><span class="ml">${ml(S.m)}</span><button ${ix>=ms.length-1?'disabled':''} onclick="chM(1)">›</button></div>`;
}

function rV(){return S.v==='home'?rHome():S.v==='expenses'?rList('expense'):S.v==='income'?rList('income'):S.v==='stats'?rSt():rHome();}

// HOME
function rHome(){
  const mE=S.expenses.filter(e=>e.date?.startsWith(S.m)),mI=S.incomes.filter(i=>i.date?.startsWith(S.m));
  const tE=mE.reduce((s,e)=>s+Number(e.amount),0),tI=mI.reduce((s,i)=>s+Number(i.amount),0);
  const pB=accBal(S.m),bal=pB+tI-tE;
  const bC={};mE.forEach(e=>{bC[e.category]=(bC[e.category]||0)+Number(e.amount);});
  const tC=Object.entries(bC).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const bU={};mE.forEach(e=>{bU[e.user_id]=(bU[e.user_id]||0)+Number(e.amount);});
  const rec=[...mE.map(e=>({...e,_t:'e'})),...mI.map(i=>({...i,_t:'i'}))].sort((a,b)=>new Date(b.created_at||b.date)-new Date(a.created_at||a.date)).slice(0,6);

  return`<div class="ca">${rMN()}
    <div class="cg" style="margin-top:12px">
      <div class="card cf" style="background:linear-gradient(135deg,rgba(139,92,246,0.15),rgba(109,40,217,0.08));border-color:rgba(139,92,246,0.15);padding:20px">
        <div style="text-align:center;margin-bottom:12px">
          <div style="font-size:11px;color:var(--text-secondary);font-weight:600;letter-spacing:0.08em;margin-bottom:4px">BALANCE ACUMULADO</div>
          <div style="font-size:34px;font-weight:800;color:${bal>=0?'#a5f3ab':'var(--red)'};letter-spacing:-0.02em">${fmt(bal)}</div>
          ${pB!==0?`<div style="font-size:11px;color:var(--text-muted);margin-top:2px">Saldo anterior: ${fmt(pB)}</div>`:''}
        </div>
        <div style="display:flex;gap:12px">
          <div style="flex:1;background:var(--green-bg);border-radius:12px;padding:10px 12px;text-align:center">
            <div style="font-size:10px;color:var(--green);font-weight:600;letter-spacing:0.06em">INGRESOS</div>
            <div style="font-size:18px;font-weight:700;color:var(--green);margin-top:2px">${fmt(tI)}</div>
          </div>
          <div style="flex:1;background:var(--orange-bg);border-radius:12px;padding:10px 12px;text-align:center">
            <div style="font-size:10px;color:var(--orange);font-weight:600;letter-spacing:0.06em">GASTOS</div>
            <div style="font-size:18px;font-weight:700;color:var(--orange);margin-top:2px">${fmt(tE)}</div>
          </div>
        </div>
      </div>
      ${S.users.length?`<div class="card"><div style="font-size:11px;color:var(--text-secondary);font-weight:600;letter-spacing:0.06em;margin-bottom:10px">GASTOS POR PERSONA</div>
        <div style="display:flex;gap:10px">${S.users.map(u=>`<div style="flex:1;text-align:center"><span style="font-size:26px">${u.avatar}</span>
          <div style="font-size:12px;color:var(--violet-light);font-weight:600;margin-top:2px">${esc(u.name)}</div>
          <div style="font-size:15px;font-weight:700;margin-top:1px">${fmt(bU[u.id]||0)}</div></div>`).join('')}</div></div>`:''}
      ${tC.length?`<div class="card"><div style="font-size:11px;color:var(--text-secondary);font-weight:600;letter-spacing:0.06em;margin-bottom:10px">TOP CATEGORÍAS</div>
        ${tC.map(([id,amt])=>{const c=gc(id);const p=tE>0?amt/tE*100:0;
          return`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <span style="font-size:13px;color:var(--violet-light)">${c.i} ${c.n}</span>
            <span style="font-size:13px;font-weight:700">${fmt(amt)}</span></div>
            <div class="pb"><div class="f" style="width:${p}%;background:${c.c}"></div></div></div>`;}).join('')}</div>`:''}
      <div class="card cf"><div style="font-size:11px;color:var(--text-secondary);font-weight:600;letter-spacing:0.06em;margin-bottom:10px">ÚLTIMOS MOVIMIENTOS</div>
        ${rec.length?rec.map((it,j)=>{const isI=it._t==='i';const ct=isI?gi(it.type):gc(it.category);
          return`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;${j<rec.length-1?'border-bottom:1px solid rgba(255,255,255,0.03)':''}">
            <span style="font-size:20px">${ct.i}</span><div style="flex:1;min-width:0">
            <div style="font-size:13px;color:#d4d0ec;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.description||ct.n)}</div>
            <div style="font-size:10px;color:var(--text-muted)">${it.date}</div></div>
            <div style="font-size:14px;font-weight:700;color:${isI?'var(--green)':'var(--orange)'}">${isI?'+':'-'}${fmt(it.amount)}</div></div>`;}).join('')
          :'<div style="text-align:center;padding:16px 0;color:var(--text-dim);font-size:13px">No hay movimientos este mes</div>'}
      </div>
    </div>
  </div>`;
}

// LIST
function rList(type){
  const isE=type==='expense',items=isE?S.expenses:S.incomes;
  const fl=items.filter(e=>e.date?.startsWith(S.m)),tot=fl.reduce((s,e)=>s+Number(e.amount),0);
  const gr={};fl.forEach(e=>{const d=e.date||'';if(!gr[d])gr[d]=[];gr[d].push(e);});
  const ds=Object.keys(gr).sort((a,b)=>b.localeCompare(a));

  return`<div class="ca">${rMN()}
    <div class="card" style="margin-top:12px;text-align:center;background:${isE?'linear-gradient(135deg,rgba(249,115,22,0.1),rgba(239,68,68,0.05))':'linear-gradient(135deg,rgba(16,185,129,0.1),rgba(52,211,153,0.05))'};border-color:${isE?'rgba(249,115,22,0.15)':'rgba(16,185,129,0.15)'}">
      <div style="font-size:11px;color:var(--text-secondary);font-weight:600;letter-spacing:0.08em">TOTAL ${isE?'GASTOS':'INGRESOS'} DEL MES</div>
      <div style="font-size:30px;font-weight:800;color:${isE?'var(--orange)':'var(--green)'};margin-top:4px">${fmt(tot)}</div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:2px">${fl.length} registros</div>
    </div>
    ${ds.map(date=>`<div style="margin-top:14px">
      <div style="font-size:11px;color:var(--text-muted);font-weight:600;letter-spacing:0.06em;margin-bottom:6px;padding-left:4px">${dl(date)}</div>
      ${gr[date].map(it=>{const ct=isE?gc(it.category):gi(it.type);const us=S.users.find(u=>u.id===it.user_id);const ed=S.ed===it.id;
        return`<div class="swc"><div class="swd" onclick="del('${it.id}','${type}')"><span>Eliminar</span></div>
          <div class="swi"><div class="card" style="border-radius:14px;padding:12px 14px;margin:0">
            <div style="display:flex;align-items:center;gap:10px">
              <div style="width:40px;height:40px;border-radius:12px;background:${ct.c}15;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">${ct.i}</div>
              <div style="flex:1;min-width:0">
                <div style="font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.description||ct.n)}</div>
                <div style="font-size:11px;color:var(--text-muted);margin-top:1px;display:flex;align-items:center;gap:4px;flex-wrap:wrap">
                  ${us?us.avatar+' '+esc(us.name)+' ·':''} ${ct.n}
                  <button class="edb" onclick="event.stopPropagation();tgEd('${it.id}')" title="Editar fecha">📅 ${it.date}</button>
                </div>
                ${ed?`<div class="der" onclick="event.stopPropagation()">
                  <input type="date" id="de-${it.id}" value="${it.date}">
                  <button onclick="svDt('${it.id}','${type}')" style="background:var(--violet);color:#fff">✓</button>
                  <button onclick="S.ed=null;R()" style="background:rgba(255,255,255,0.06);color:var(--text-muted)">✕</button>
                </div>`:''}
              </div>
              <div style="font-size:16px;font-weight:700;color:${isE?'var(--orange)':'var(--green)'};flex-shrink:0">${fmt(it.amount)}</div>
              <button class="pdb" onclick="del('${it.id}','${type}')" title="Eliminar">🗑</button>
            </div>
          </div></div></div>`;}).join('')}
    </div>`).join('')}
    ${fl.length===0?`<div class="empty"><div class="em">${isE?'💸':'💰'}</div><div style="font-size:14px">No hay ${isE?'gastos':'ingresos'} este mes</div></div>`:''}
  </div>`;
}

// STATS
function rSt(){
  const mE=S.expenses.filter(e=>e.date?.startsWith(S.m)),mI=S.incomes.filter(i=>i.date?.startsWith(S.m));
  const tE=mE.reduce((s,e)=>s+Number(e.amount),0),tI=mI.reduce((s,i)=>s+Number(i.amount),0);
  const pB=accBal(S.m),sP=tI>0?Math.round((tI-tE)/tI*100):0;
  const now=new Date(),tr=[];
  for(let j=5;j>=0;j--){const d=new Date(now.getFullYear(),now.getMonth()-j,1);const m=mk(d);
    tr.push({l:MES[d.getMonth()].slice(0,3),e:S.expenses.filter(x=>x.date?.startsWith(m)).reduce((s,x)=>s+Number(x.amount),0),
      i:S.incomes.filter(x=>x.date?.startsWith(m)).reduce((s,x)=>s+Number(x.amount),0)});}
  const mx=Math.max(...tr.map(t=>Math.max(t.e,t.i)),1);
  const bC={};mE.forEach(e=>{bC[e.category]=(bC[e.category]||0)+Number(e.amount);});
  const sC=Object.entries(bC).sort((a,b)=>b[1]-a[1]);
  const bU={};mE.forEach(e=>{bU[e.user_id]=(bU[e.user_id]||0)+Number(e.amount);});

  return`<div class="ca">${rMN()}
    <div class="cg" style="margin-top:12px">
      <div class="card cf"><div style="font-size:11px;color:var(--text-secondary);font-weight:600;letter-spacing:0.06em;margin-bottom:12px">RESUMEN MENSUAL</div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
          <div style="text-align:center"><div style="font-size:10px;color:var(--text-muted);font-weight:600">Anterior</div><div style="font-size:14px;font-weight:700;color:${pB>=0?'#a5f3ab':'var(--red)'}">${fmt(pB)}</div></div>
          <div style="text-align:center"><div style="font-size:10px;color:var(--green);font-weight:600">Ingresos</div><div style="font-size:14px;font-weight:700;color:var(--green)">${fmt(tI)}</div></div>
          <div style="text-align:center"><div style="font-size:10px;color:var(--orange);font-weight:600">Gastos</div><div style="font-size:14px;font-weight:700;color:var(--orange)">${fmt(tE)}</div></div>
          <div style="text-align:center"><div style="font-size:10px;color:var(--violet-light);font-weight:600">Ahorro</div><div style="font-size:14px;font-weight:700;color:${sP>=0?'#a5f3ab':'var(--red)'}">${sP}%</div></div>
        </div>
      </div>
      <div class="card cf"><div style="font-size:11px;color:var(--text-secondary);font-weight:600;letter-spacing:0.06em;margin-bottom:14px">TENDENCIA 6 MESES</div>
        <div style="display:flex;align-items:flex-end;gap:6px;height:100px">
          ${tr.map(t=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">
            <div style="width:100%;display:flex;gap:2px;align-items:flex-end;justify-content:center;height:80px">
              <div class="tb" style="width:40%;background:linear-gradient(to top,rgba(16,185,129,0.3),rgba(16,185,129,0.6));height:${(t.i/mx)*100}%;min-height:${t.i>0?4:0}px"></div>
              <div class="tb" style="width:40%;background:linear-gradient(to top,rgba(249,115,22,0.3),rgba(249,115,22,0.6));height:${(t.e/mx)*100}%;min-height:${t.e>0?4:0}px"></div>
            </div><span style="font-size:9px;color:var(--text-muted);font-weight:600">${t.l}</span></div>`).join('')}
        </div>
        <div style="display:flex;justify-content:center;gap:16px;margin-top:10px">
          <div style="display:flex;align-items:center;gap:4px"><div style="width:8px;height:8px;border-radius:2px;background:rgba(16,185,129,0.6)"></div><span style="font-size:10px;color:var(--text-muted)">Ingresos</span></div>
          <div style="display:flex;align-items:center;gap:4px"><div style="width:8px;height:8px;border-radius:2px;background:rgba(249,115,22,0.6)"></div><span style="font-size:10px;color:var(--text-muted)">Gastos</span></div>
        </div>
      </div>
      ${sC.length?`<div class="card"><div style="font-size:11px;color:var(--text-secondary);font-weight:600;letter-spacing:0.06em;margin-bottom:10px">POR CATEGORÍA</div>
        ${sC.map(([id,amt])=>{const c=gc(id);const p=tE>0?Math.round(amt/tE*100):0;
          return`<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
            <div style="width:36px;height:36px;border-radius:10px;background:${c.c}15;display:flex;align-items:center;justify-content:center;font-size:18px">${c.i}</div>
            <div style="flex:1"><div style="display:flex;justify-content:space-between;margin-bottom:3px">
              <span style="font-size:12px;color:var(--violet-light);font-weight:600">${c.n}</span>
              <span style="font-size:12px;font-weight:700">${fmt(amt)} <span style="color:var(--text-muted);font-weight:500">(${p}%)</span></span>
            </div><div class="pb"><div class="f" style="width:${p}%;background:${c.c}"></div></div></div></div>`;}).join('')}</div>`:''}
      ${S.users.length&&Object.keys(bU).length?`<div class="card"><div style="font-size:11px;color:var(--text-secondary);font-weight:600;letter-spacing:0.06em;margin-bottom:10px">POR PERSONA</div>
        ${S.users.map(u=>{const amt=bU[u.id]||0;const p=tE>0?Math.round(amt/tE*100):0;
          return`<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
            <span style="font-size:24px">${u.avatar}</span><div style="flex:1"><div style="display:flex;justify-content:space-between;margin-bottom:3px">
              <span style="font-size:12px;color:var(--violet-light);font-weight:600">${esc(u.name)}</span>
              <span style="font-size:12px;font-weight:700">${fmt(amt)}</span>
            </div><div class="pb"><div class="f" style="width:${p}%;background:${u.color}"></div></div></div></div>`;}).join('')}</div>`:''}
    </div>
  </div>`;
}

function rFab(){
  let h='';const isPC=window.innerWidth>=768;
  if(S.fo){h+=`<div class="fo" onclick="tgF()"></div>
    <div class="fm" style="bottom:${isPC?'96px':'136px'};right:${isPC?'32px':'20px'}">
      <button onclick="oM('income')" style="background:linear-gradient(135deg,#059669,#10b981);box-shadow:0 4px 12px rgba(16,185,129,0.3)">💰 Ingreso</button>
      <button onclick="oM('expense')" style="background:linear-gradient(135deg,#ea580c,#f97316);box-shadow:0 4px 12px rgba(249,115,22,0.3)">💸 Gasto</button>
    </div>`;}
  h+=`<button class="fab ${S.fo?'open':''}" onclick="tgF()">+</button>`;return h;
}

function rMdl(){
  if(!S.md)return'';const isE=S.md==='expense',its=isE?CATS:INCT;
  return`<div class="mbg" onclick="if(event.target===this)cM()"><div class="mdl">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h3>${isE?'Nuevo Gasto':'Nuevo Ingreso'}</h3>
      <button class="cb" onclick="cM()">✕</button></div>
    <label>QUIÉN</label>
    <div style="display:flex;gap:8px;margin-bottom:16px">${S.users.map(u=>`<button class="ub ${S.cu?.id===u.id?'sel':''}" onclick="swU('${u.id}')" style="flex:1;padding:10px 8px;gap:4px">
      <span style="font-size:22px">${u.avatar}</span><span style="font-size:11px;color:${S.cu?.id===u.id?'var(--violet-light)':'var(--text-muted)'};font-weight:600">${esc(u.name)}</span></button>`).join('')}</div>
    <label>MONTO</label>
    <div style="position:relative;margin-bottom:16px"><span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-secondary);font-size:18px;font-weight:700">$</span>
      <input type="number" id="ma" inputmode="decimal" placeholder="0" autocomplete="off"></div>
    <label>DESCRIPCIÓN</label>
    <input type="text" id="md" placeholder="¿En qué?" maxlength="200" autocomplete="off" style="margin-bottom:16px">
    <label>${isE?'CATEGORÍA':'TIPO'}</label>
    <div id="mc" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px">
      ${its.map((c,j)=>`<button class="ctb ${j===0?'sel':''}" data-cat="${c.id}" onclick="sC('${c.id}')" style="padding:10px 4px;gap:3px;${j===0?`border-color:${c.c};background:${c.c}15`:''}" data-color="${c.c}">
        <span style="font-size:20px">${c.i}</span><span style="font-size:9px;color:var(--text-secondary);font-weight:600">${c.n}</span></button>`).join('')}</div>
    <label>FECHA</label>
    <input type="date" id="mf" value="${new Date().toISOString().split('T')[0]}" style="margin-bottom:20px">
    <button class="sb" id="ms" onclick="svI()">Guardar</button>
  </div></div>`;
}

function rBN(){
  const its=[{id:'home',ic:'⌂',l:'Inicio'},{id:'expenses',ic:'↗',l:'Gastos'},{id:'income',ic:'↙',l:'Ingresos'},{id:'stats',ic:'◔',l:'Stats'}];
  return`<nav class="bottom-nav">${its.map(it=>`<button class="nb ${S.v===it.id?'a':''}" onclick="nav('${it.id}')">
    <span class="ic">${it.ic}</span><span class="lb">${it.l}</span></button>`).join('')}</nav>`;
}

// ACCIONES
function nav(v){S.v=v;S.ed=null;R();window.scrollTo(0,0);}
function swU(id){S.cu=S.users.find(u=>u.id===id)||S.cu;R();}
function tgF(){S.fo=!S.fo;R();}
function oM(t){S.md=t;S.fo=false;R();}
function cM(){S.md=null;R();}
function chM(d){const ms=mR(),ix=ms.indexOf(S.m),ni=ix+d;if(ni>=0&&ni<ms.length){S.m=ms[ni];S.ed=null;R();}}

let scId=null;
function sC(id){scId=id;document.querySelectorAll('#mc .ctb').forEach(b=>{const a=b.dataset.cat===id;b.classList.toggle('sel',a);b.style.borderColor=a?b.dataset.color:'rgba(255,255,255,0.06)';b.style.background=a?b.dataset.color+'15':'rgba(255,255,255,0.02)';});}

async function svI(){
  const el=document.getElementById('ma');if(!el)return;
  const amt=sanA(el.value);if(!amt||!S.cu)return;
  const desc=san(document.getElementById('md')?.value||''),date=document.getElementById('mf')?.value||new Date().toISOString().split('T')[0];
  const isE=S.md==='expense',cat=scId||(isE?'food':'salary');
  const btn=document.getElementById('ms');if(btn){btn.textContent='Guardando...';btn.style.opacity='0.6';}
  if(isE){const r=await sb('expenses','POST',{user_id:S.cu.id,amount:amt,description:desc,category:cat,date});if(r?.[0])S.expenses.unshift(r[0]);}
  else{const r=await sb('incomes','POST',{user_id:S.cu.id,amount:amt,description:desc,type:cat,date});if(r?.[0])S.incomes.unshift(r[0]);}
  scId=null;cM();
}

async function del(id,type){
  if(!confirm('¿Eliminar este registro?'))return;
  if(type==='expense'){await sb('expenses','DELETE',null,`?id=eq.${id}`);S.expenses=S.expenses.filter(e=>e.id!==id);}
  else{await sb('incomes','DELETE',null,`?id=eq.${id}`);S.incomes=S.incomes.filter(i=>i.id!==id);}
  R();
}

function tgEd(id){S.ed=S.ed===id?null:id;R();setTimeout(()=>{const inp=document.getElementById('de-'+id);if(inp)inp.focus();},50);}

async function svDt(id,type){
  const inp=document.getElementById('de-'+id);if(!inp||!inp.value)return;
  const nd=inp.value,tbl=type==='expense'?'expenses':'incomes';
  const r=await sb(tbl,'PATCH',{date:nd},`?id=eq.${id}`);
  if(r){const arr=type==='expense'?S.expenses:S.incomes;const it=arr.find(e=>e.id===id);if(it)it.date=nd;}
  S.ed=null;R();
}

function bEv(){
  document.querySelectorAll('.swi').forEach(el=>{
    let sx=0,cx=0,sw=false;
    el.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sw=true;});
    el.addEventListener('touchmove',e=>{if(!sw)return;const d=Math.min(0,e.touches[0].clientX-sx);cx=d;el.style.transform=`translateX(${Math.max(d,-90)}px)`;});
    el.addEventListener('touchend',()=>{sw=false;el.style.transform=cx<-50?'translateX(-90px)':'translateX(0)';cx=0;});
  });
  const ai=document.getElementById('ma');
  if(ai){const ub=()=>{const b=document.getElementById('ms');if(!b)return;b.classList.toggle('ac',sanA(ai.value)!==null);};ai.addEventListener('input',ub);ub();}
}

async function init(){
  R();
  const[ud,ed,id]=await Promise.all([sb('users','GET',null,'?select=*&order=created_at.asc'),sb('expenses','GET',null,'?select=*&order=created_at.desc'),sb('incomes','GET',null,'?select=*&order=created_at.desc')]);
  if(ud)S.users=ud;if(ed)S.expenses=ed;if(id)S.incomes=id;
  if(S.users.length&&!S.cu)S.cu=S.users[0];S.ld=false;R();
}
init();
</script>
</body>
</html>
